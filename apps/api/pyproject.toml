[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speaking-training-api"
version = "0.1.0"
description = "FastAPI Backend for Japanese Speaking AI Training OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "cryptography>=42.0.5",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0.0",
    "pykakasi>=2.2.0",
    "sudachipy>=0.6.11",
    "sudachidict_core>=20260723",
    "scipy>=1.11.0",
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=1.0.0",
    # Mode 2/3 additions — previously guarded, now installed (whisperx optional due to torch size)
    "wordfreq>=3.0",
    "jamdict>=0.1a11",
    "pyopenjtalk>=0.3",
    "librosa>=0.10",
    "praat-parselmouth>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

